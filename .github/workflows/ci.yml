name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact: mai-linux
          - os: macos-latest
            name: macOS
            artifact: mai-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build release CLI
        run: swift build --package-path MaiCore -c release --product mai

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: MaiCore/.build/release/mai
          if-no-files-found: error

  build:
    name: Build (Xcode latest on macOS latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Show Xcode and macOS versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m

      - name: List available iOS Simulator runtimes
        run: xcrun simctl list runtimes

      - name: Verify shared aitest tooling
        run: make aitest-build

      - name: Build (arm64 only)
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketMai.xcodeproj \
            -scheme PocketMai \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            VALID_ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            build

      - name: Run conversation compatibility tests
        run: make test
