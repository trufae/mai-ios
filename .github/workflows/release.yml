name: Release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
            target: linux-x64
            runner_arch: x86_64
          - os: ubuntu-24.04-arm
            name: Linux arm64
            target: linux-arm64
            runner_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version and verify architecture
        run: |
          swift --version
          test "$(uname -m)" = "${{ matrix.runner_arch }}"

      - name: Build release CLI
        run: |
          swift build --package-path MaiCore -c release --product pmai -Xswiftc -Osize
          strip -x MaiCore/.build/release/pmai

      - name: Package CLI
        run: |
          asset="pmai-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C MaiCore/.build/release pmai
          tar -tzf "$asset"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: pmai-${{ matrix.target }}
          path: pmai-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select latest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # Keep releases independent of private signing credentials. The IPA can
      # be signed after download with the user's own Apple identity.
      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project PocketMai.xcodeproj \
            -scheme PocketMai \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -eu
          app=build/DerivedData/Build/Products/Release-iphoneos/PocketMai.app
          test -d "$app"

          package="$RUNNER_TEMP/PocketMai-ipa"
          mkdir -p "$package/Payload"
          ditto "$app" "$package/Payload/PocketMai.app"

          safe_tag=$(printf '%s' "$GITHUB_REF_NAME" \
            | tr -c '[:alnum:]._-' '-')
          asset="PocketMai-$safe_tag.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$package/Payload" "$asset"
          unzip -tqq "$asset"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: pocketmai-ipa
          path: PocketMai-*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [cli, ipa]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: PocketMai ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
