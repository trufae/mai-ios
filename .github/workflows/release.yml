name: Release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select latest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode.app found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # Keep releases independent of private signing credentials. The IPA can
      # be signed after download with the user's own Apple identity.
      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project PocketMai.xcodeproj \
            -scheme PocketMai \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -eu
          app=build/DerivedData/Build/Products/Release-iphoneos/PocketMai.app
          test -d "$app"

          package="$RUNNER_TEMP/PocketMai-ipa"
          mkdir -p "$package/Payload"
          ditto "$app" "$package/Payload/PocketMai.app"

          safe_tag=$(printf '%s' "$GITHUB_REF_NAME" \
            | tr -c '[:alnum:]._-' '-')
          asset="PocketMai-$safe_tag.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$package/Payload" "$asset"
          unzip -tqq "$asset"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: PocketMai ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: PocketMai-*.ipa
